name: Verificar LineTime
on:
  push:
    branches: [modernizacao-segura]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe dos arquivos PHP
        run: |
          find 'OFICIAL - Projeto-LT' -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Validar JavaScript da demonstração
        run: node --check demo/app.js
      - name: Conferir arquivos da demonstração
        run: |
          test -s demo/index.html
          test -s demo/style.css
          test -s demo/app.js
